<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#0b0c0e" />
    </linearGradient>
    <linearGradient id="tufOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ff3e00" />
    </linearGradient>
    <linearGradient id="tufCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon/shield -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#2b303c" stroke-width="2.5" />

  <!-- TUF Wings Graphic -->
  <g transform="translate(64, 62) scale(0.85)">
    <!-- Left Wing -->
    <path d="M -44 -26 L -20 -26 L -8 -8 L -18 -8 L -26 -18 L -36 -18 L -24 -2 L -34 -2 Z" fill="url(#tufOrange)" filter="url(#glow)" />
    <path d="M -44 -2 L -20 -2 L -8 16 L -18 16 L -26 6 L -36 6 L -24 22 L -34 22 Z" fill="url(#tufOrange)" />

    <!-- Right Wing -->
    <path d="M 44 -26 L 20 -26 L 8 -8 L 18 -8 L 26 -18 L 36 -18 L 24 -2 L 34 -2 Z" fill="url(#tufCyan)" filter="url(#glow)" />
    <path d="M 44 -2 L 20 -2 L 8 16 L 18 16 L 26 6 L 36 6 L 24 22 L 34 22 Z" fill="url(#tufCyan)" />

    <!-- Center TUF Core Badge -->
    <polygon points="0,-16 8,-4 0,8 -8,-4" fill="#ffffff" />
    <circle cx="0" cy="22" r="3.5" fill="#38bdf8" />
  </g>
</svg>
