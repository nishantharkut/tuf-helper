[package]
name = "tuf-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Native Slint desktop control center for ASUS laptops and DDC/CI external displays on Linux"
build = "build.rs"

[dependencies]
tuf-core = { path = "../tuf-core" }
zbus = { version = "5", features = ["blocking-api"] }
tempfile = "3"
slint = "=1.18.1"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
