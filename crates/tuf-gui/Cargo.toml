[package]
name = "tuf-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Native Slint desktop control center for ASUS laptops and DDC/CI external displays on Linux"
build = "build.rs"

[dependencies]
tuf-core = { path = "../tuf-core" }
zbus = { version = "5", features = ["blocking-api"] }
tempfile = "3"
slint = "=1.18.1"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[package.metadata.deb]
maintainer = "Nishant Harkut <nhnishantharkut@gmail.com>"
copyright = "2026, Nishant Harkut <nhnishantharkut@gmail.com>"
license-file = ["../../LICENSE", "4"]
extended-description = """\
Native Slint desktop control center for ASUS TUF/ROG laptops and VESA DDC/CI \
external displays on Linux. Supports dual-display brightness and refresh-rate \
controls, DDC/CI monitor calibration, asusd firmware tuning, and dGPU-safe \
sysfs telemetry."""
section = "utils"
priority = "optional"
depends = "$auto, dbus, ddcutil"
recommends = "asusd"
assets = [
    ["target/release/tuf-gui", "usr/bin/tuf-gui", "755"],
    ["../../packaging/tuf-helper.desktop", "usr/share/applications/tuf-helper.desktop", "644"],
    ["../../assets/tuf-helper.svg", "usr/share/icons/hicolor/scalable/apps/tuf-helper.svg", "644"],
    ["../../packaging/io.github.nishantharkut.TufHelper.metainfo.xml", "usr/share/metainfo/io.github.nishantharkut.TufHelper.metainfo.xml", "644"],
]
