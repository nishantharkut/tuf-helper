name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Build, Test & Docs (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build & test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libfontconfig1-dev \
            dbus \
            appstream \
            desktop-file-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace with warnings denied
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --workspace --all-targets --locked

      - name: Verify rustdoc generation
        run: cargo doc --workspace --no-deps --locked

      - name: Build release binary (main push)
        if: github.event_name == 'push'
        run: cargo build --release --workspace --locked

      - name: Validate installer script & packaging metadata
        run: |
          bash -n scripts/install.sh
          desktop-file-validate packaging/tuf-helper.desktop
          appstreamcli validate --no-net packaging/io.github.nishantharkut.TufHelper.metainfo.xml
